[package]
name = "mordinals-carrier"
version = "0.0.0"
edition = "2021"
publish = false
description = "Puts one Mordinals record (MD1) into an ordinary Monero transaction paid from the relay's own coins. Offline test chain or stagenet only."

[[bin]]
name = "mordinals-carrier"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
hex = "0.4"
rand_core = {version = "=0.6.4", features = ["getrandom"]}
monero-wallet = "=0.2.0"
curve25519-dalek = "=4.1.3"
zeroize = "=1.8.2"
monero-simple-request-rpc = "=0.1.0"
tokio = {version = "1", features = ["rt", "macros"]}
# Open XMR20 tokens (xmr20-tokens/OPEN.md): the asset id of a token and the owner key of a Monero address, for mint records.
decaf377 = "=0.10.1"
blake2b_simd = "=1.0.5"

[workspace]
