# Runs the offline tests on every pull request and on every change to main.
# It only reads the repository: nothing is published, uploaded or deployed, and no secrets are used.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Rule library, reader and NFT decoder
        run: npm test
      - name: The page bundle is what the rule library builds to
        run: node reader/views/build.mjs --check
      - name: The added owner-list entry is well formed
        run: node --input-type=module -e "const {readOwners}=await import('./reader/lib/owners.mjs');const o=readOwners('ownership-index/result/owners.jsonl,ownership-index/added/added.jsonl');if(o.length!==42895||!o.every((x,i)=>x.number===i))throw Error('owner list numbers do not run from 0');"
